<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nooriya</title>

    <!-- Main font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Nunito + Silkscreen -->
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --background: #21171C;
            --text: #F4E9ED;
            --muted: #B99AA5;
            --accent: #D46489;
            --border: #38232B;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: var(--background);
            color: var(--text);

            font-family: "Nunito", sans-serif;
        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {
            height: 72px;
            padding: 0 5%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid var(--border);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 45px;
        }

        .name {
            font-size: 19px;
            font-weight: 700;
            color: var(--text);
        }

        .links {
            display: flex;
            gap: 30px;
        }

        .links a {
            color: var(--muted);

            text-decoration: none;

            font-size: 15px;
            font-weight: 600;

            transition: color 0.25s ease;
        }

        .links a:hover,
        .links a.active {
            color: var(--accent);
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: calc(100vh - 72px);

            max-width: 1200px;
            margin: auto;

            padding: 55px 40px;

            display: grid;

            grid-template-columns: 1fr 1.15fr;

            align-items: center;

            gap: 70px;
        }


        /* =========================
           FIGURE
        ========================= */

        .figure-container {
            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 430px;
            height: 520px;

            max-width: 100%;

            cursor: crosshair;
        }

        .interaction-text {
            margin-top: -10px;

            color: var(--muted);

            font-size: 11px;

            letter-spacing: 2px;

            text-transform: uppercase;

            opacity: 0.7;
        }

        .interaction-text span {
            color: var(--accent);
        }


        /* =========================
           INTRO
        ========================= */

        .intro {
            padding-left: 20px;
        }

        .small-title {
            margin-bottom: 24px;

            color: var(--accent);

            font-size: 11px;

            letter-spacing: 3px;
        }


        /* =========================
           PIXEL HEADING
        ========================= */

        .hero-title {
            min-height: 150px;

            margin: 0 0 30px 0;

            font-family: "Silkscreen", monospace;

            font-size: clamp(28px, 3.2vw, 44px);

            font-weight: 400;

            line-height: 1.35;

            letter-spacing: -1px;

            color: var(--text);

            white-space: nowrap;
        }

        #typing-text {
            white-space: normal;
        }

        .pink-text {
            color: var(--accent);
        }


        /* BLINKING TERMINAL CURSOR */

        .cursor {
            display: inline-block;

            width: 0.65em;
            height: 0.12em;

            margin-left: 5px;

            background: var(--accent);

            vertical-align: -0.1em;

            animation: blink 0.8s steps(1) infinite;
        }

        @keyframes blink {

            0%,
            45% {
                opacity: 1;
            }

            46%,
            100% {
                opacity: 0;
            }
        }


        /* =========================
           DESCRIPTION
        ========================= */

        .description {
            max-width: 560px;

            margin-bottom: 35px;

            color: var(--muted);

            font-size: 18px;

            line-height: 1.8;
        }


        /* =========================
           BUTTON
        ========================= */

        .button {
            display: inline-block;

            padding: 13px 22px;

            border: 1px solid var(--accent);
            border-radius: 8px;

            color: var(--accent);

            text-decoration: none;

            font-size: 15px;

            transition:
                background 0.25s ease,
                color 0.25s ease,
                transform 0.25s ease;
        }

        .button:hover {
            background: var(--accent);

            color: var(--background);

            transform: translateY(-2px);
        }


        .accent-line {
            width: 55px;
            height: 2px;

            margin-top: 45px;

            background: var(--accent);

            opacity: 0.8;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            nav {
                padding: 0 25px;
            }

            .links {
                display: none;
            }

            .hero {
                grid-template-columns: 1fr;

                text-align: center;

                padding: 30px 20px;

                gap: 10px;
            }

            .intro {
                padding-left: 0;
            }

            .figure-container {
                order: 2;
            }

            canvas {
                width: 330px;
                height: 400px;
            }

            .hero-title {
                min-height: 120px;

                font-size: clamp(30px, 9vw, 44px);
            }

            .description {
                margin-left: auto;
                margin-right: auto;
            }

            .accent-line {
                margin-left: auto;
                margin-right: auto;
            }
        }

    </style>
</head>


<body>


<!-- =========================
     NAVIGATION
========================= -->

<nav>

    <div class="nav-left">

        <div class="name">
            Nooriya
        </div>

        <div class="links">

            <a href="#" class="active">Home</a>

            <a href="#about">About</a>

            <a href="#experience">Experience</a>

            <a href="#projects">Projects</a>

            <a href="#art">Art</a>

        </div>

    </div>

</nav>



<!-- =========================
     HERO
========================= -->

<section class="hero">


    <!-- TEMPORARY INTERACTIVE FIGURE -->

    <div class="figure-container">

        <canvas id="figure"></canvas>

        <div class="interaction-text">
            <span>INTERACT</span> — move your cursor
        </div>

    </div>



    <!-- INTRO -->

    <div class="intro">


        <div class="small-title">
            ELECTRICAL ENGINEERING • 
        </div>


        <!-- TYPING HEADING -->

        <h1 class="hero-title">

            <span id="typing-text"></span>

            <span class="cursor"></span>

        </h1>


        <p class="description">

            Electrical engineering student exploring
            circuits, hardware, technology and the
            creative side of engineering.

        </p>


        <a href="#about" class="button">
            more about nooriya →
        </a>


        <div class="accent-line"></div>

    </div>

</section>



<script>


/* =========================================
   TYPING ANIMATION
========================================= */


const typingElement =
    document.getElementById("typing-text");


const beforeName = "hi, ";

const nameText = "nooriya";

const afterName = " here!";


let typingStage = 0;

let characterIndex = 0;


/*
    Controls typing speed.

    Higher number = slower typing.
*/

const typingSpeed = 105;



function typeHeading() {


    /* FIRST: "hi, " */

    if (typingStage === 0) {


        if (characterIndex < beforeName.length) {

            typingElement.innerHTML +=
                beforeName.charAt(characterIndex);

            characterIndex++;

            setTimeout(
                typeHeading,
                typingSpeed
            );

        }

        else {

            typingStage = 1;

            characterIndex = 0;

            setTimeout(
                typeHeading,
                150
            );

        }

    }



    /* SECOND: pink "nooriya" */

    else if (typingStage === 1) {


        let pinkSpan =
            document.getElementById("typed-name");


        if (!pinkSpan) {

            pinkSpan =
                document.createElement("span");

            pinkSpan.id = "typed-name";

            pinkSpan.className = "pink-text";

            typingElement.appendChild(
                pinkSpan
            );

        }


        if (characterIndex < nameText.length) {

            pinkSpan.textContent +=
                nameText.charAt(characterIndex);

            characterIndex++;

            setTimeout(
                typeHeading,
                typingSpeed
            );

        }

        else {

            typingStage = 2;

            characterIndex = 0;

            setTimeout(
                typeHeading,
                180
            );

        }

    }



    /* THIRD: " here." */

    else if (typingStage === 2) {


        let ending =
            document.getElementById("typed-ending");


        if (!ending) {

            ending =
                document.createElement("span");

            ending.id =
                "typed-ending";

            typingElement.appendChild(
                ending
            );

        }


        if (characterIndex < afterName.length) {

            ending.textContent +=
                afterName.charAt(characterIndex);

            characterIndex++;

            setTimeout(
                typeHeading,
                typingSpeed
            );

        }

    }

}


/*
    Tiny delay when the page opens,
    then start typing.
*/

setTimeout(
    typeHeading,
    500
);



/* =========================================
   TEMPORARY INTERACTIVE FIGURE
========================================= */


const canvas =
    document.getElementById("figure");


const ctx =
    canvas.getContext("2d");


canvas.width = 430;

canvas.height = 520;


const particles = [];


const mouse = {

    x: -1000,

    y: -1000

};



/*
    PLACEHOLDER FIGURE

    Later this section gets replaced
    by Nooriya's actual portrait.
*/


for (let y = 65; y < 465; y += 9) {

    for (let x = 55; x < 375; x += 9) {


        const centerX = 215;


        const head =

            Math.pow(
                (x - centerX) / 76,
                2
            )

            +

            Math.pow(
                (y - 150) / 108,
                2
            )

            < 1;



        const neck =

            y > 225 &&

            y < 300 &&

            Math.abs(
                x - centerX
            ) < 48;



        const body =

            y > 270 &&

            Math.pow(
                (x - centerX) / 150,
                2
            )

            +

            Math.pow(
                (y - 440) / 180,
                2
            )

            < 1;



        if (
            head ||
            neck ||
            body
        ) {


            /*
                Choose the character ONCE.

                It will NOT randomly change
                while the page is sitting still.
            */


            const characterSet = [

                ".",
                ".",
                ".",
                ":",
                ":",
                "+"

            ];


            const character =

                characterSet[

                    Math.floor(

                        Math.random()

                        *

                        characterSet.length

                    )

                ];



            particles.push({

                homeX: x,

                homeY: y,

                x: x,

                y: y,

                vx: 0,

                vy: 0,

                character: character

            });

        }

    }

}



/* =========================================
   MOUSE INTERACTION
========================================= */


canvas.addEventListener(

    "mousemove",

    function(event) {


        const rect =

            canvas.getBoundingClientRect();


        mouse.x =

            (event.clientX - rect.left)

            *

            (canvas.width / rect.width);


        mouse.y =

            (event.clientY - rect.top)

            *

            (canvas.height / rect.height);

    }

);



canvas.addEventListener(

    "mouseleave",

    function() {

        mouse.x = -1000;

        mouse.y = -1000;

    }

);



/* =========================================
   TOUCH INTERACTION
========================================= */


canvas.addEventListener(

    "touchmove",

    function(event) {


        event.preventDefault();


        const touch =
            event.touches[0];


        const rect =
            canvas.getBoundingClientRect();


        mouse.x =

            (touch.clientX - rect.left)

            *

            (canvas.width / rect.width);


        mouse.y =

            (touch.clientY - rect.top)

            *

            (canvas.height / rect.height);

    },

    {
        passive: false
    }

);



canvas.addEventListener(

    "touchend",

    function() {

        mouse.x = -1000;

        mouse.y = -1000;

    }

);



/* =========================================
   FIGURE ANIMATION
========================================= */


function animate() {


    ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height

    );



    particles.forEach(

        function(particle) {


            const dx =
                particle.x - mouse.x;


            const dy =
                particle.y - mouse.y;


            const distance =

                Math.sqrt(

                    dx * dx +

                    dy * dy

                );



            /*
                ONLY react when the cursor
                gets close to the figure.
            */


            if (

                distance < 70 &&

                distance > 0.1

            ) {


                const force =

                    (70 - distance)

                    /

                    70;


                particle.vx +=

                    (dx / distance)

                    *

                    force

                    *

                    1.8;


                particle.vy +=

                    (dy / distance)

                    *

                    force

                    *

                    1.8;

            }



            /*
                SPRING BACK TO ORIGINAL
                PORTRAIT POSITION
            */


            particle.vx +=

                (
                    particle.homeX -
                    particle.x
                )

                *

                0.035;


            particle.vy +=

                (
                    particle.homeY -
                    particle.y
                )

                *

                0.035;



            /*
                FRICTION
            */


            particle.vx *= 0.82;

            particle.vy *= 0.82;



            particle.x +=
                particle.vx;


            particle.y +=
                particle.vy;



            /*
                DRAW PARTICLE

                Dusty pink palette.
            */


            ctx.fillStyle =
                "#D46489";


            ctx.font =
                "9px monospace";


            ctx.fillText(

                particle.character,

                particle.x,

                particle.y

            );

        }

    );


    requestAnimationFrame(
        animate
    );

}


animate();


</script>


</body>

</html>

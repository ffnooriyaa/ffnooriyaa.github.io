<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nooriya</title>

    <!-- Rounded font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        :root {
            --background: #090909;
            --text: #F4E9ED;
            --muted: #B99AA5;
            --accent: #D46489;
            --border: #38232B;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: "Nunito", sans-serif;
            min-height: 100vh;
        }


        /* ---------------- NAVIGATION ---------------- */

        nav {
            height: 72px;
            padding: 0 5%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid var(--border);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 45px;
        }

        .name {
            font-size: 19px;
            font-weight: 700;
            color: var(--text);
        }

        .links {
            display: flex;
            gap: 30px;
        }

        .links a {
            color: var(--muted);
            text-decoration: none;

            font-size: 15px;
            font-weight: 600;

            transition: color 0.25s ease;
        }

        .links a:hover {
            color: var(--accent);
        }

        .links a.active {
            color: var(--accent);
        }


        /* ---------------- HERO ---------------- */

        .hero {
            min-height: calc(100vh - 72px);

            max-width: 1200px;
            margin: auto;

            padding: 55px 40px;

            display: grid;
            grid-template-columns: 1fr 1.15fr;

            align-items: center;
            gap: 70px;
        }


        /* ---------------- FIGURE ---------------- */

        .figure-container {
            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 430px;
            height: 520px;

            max-width: 100%;

            cursor: crosshair;
        }

        .interaction-text {
            margin-top: -10px;

            color: var(--muted);

            font-size: 12px;

            letter-spacing: 2px;

            text-transform: uppercase;

            opacity: 0.7;
        }

        .interaction-text span {
            color: var(--accent);
        }


        /* ---------------- INTRO ---------------- */

        .intro {
            padding-left: 20px;
        }

        .small-title {
            color: var(--accent);

            font-size: 12px;

            letter-spacing: 3px;

            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 30px 0;

            font-size: clamp(46px, 5vw, 72px);

            font-weight: 400;

            line-height: 1.1;

            letter-spacing: -2px;
        }

        h1 span {
            color: var(--accent);

            font-weight: 700;
        }

        .description {
            max-width: 560px;

            color: var(--muted);

            font-size: 18px;

            line-height: 1.8;

            margin-bottom: 35px;
        }


        /* ---------------- BUTTON ---------------- */

        .button {
            display: inline-block;

            padding: 13px 22px;

            border: 1px solid var(--accent);

            border-radius: 8px;

            color: var(--accent);

            text-decoration: none;

            font-size: 15px;

            transition:
                background 0.25s ease,
                color 0.25s ease,
                transform 0.25s ease;
        }

        .button:hover {
            background: var(--accent);

            color: var(--background);

            transform: translateY(-2px);
        }


        /* ---------------- DECORATIVE LINE ---------------- */

        .accent-line {
            width: 55px;
            height: 2px;

            background: var(--accent);

            margin-top: 45px;

            opacity: 0.8;
        }


        /* ---------------- MOBILE ---------------- */

        @media (max-width: 800px) {

            nav {
                padding: 0 25px;
            }

            .links {
                display: none;
            }

            .hero {
                grid-template-columns: 1fr;

                text-align: center;

                padding: 30px 20px;

                gap: 10px;
            }

            .intro {
                padding-left: 0;
            }

            .figure-container {
                order: 2;
            }

            canvas {
                width: 330px;
                height: 400px;
            }

            .description {
                margin-left: auto;
                margin-right: auto;
            }

            .accent-line {
                margin-left: auto;
                margin-right: auto;
            }
        }

    </style>

</head>


<body>


<!-- ==================== NAV ==================== -->

<nav>

    <div class="nav-left">

        <div class="name">
            Nooriya
        </div>

        <div class="links">

            <a href="#" class="active">Home</a>

            <a href="#about">About</a>

            <a href="#experience">Experience</a>

            <a href="#projects">Projects</a>

            <a href="#art">Art</a>

        </div>

    </div>

</nav>



<!-- ==================== HERO ==================== -->

<section class="hero">


    <!-- INTERACTIVE FIGURE -->

    <div class="figure-container">

        <canvas id="figure"></canvas>

        <div class="interaction-text">
            <span>INTERACT</span> — move your cursor
        </div>

    </div>



    <!-- INTRODUCTION -->

    <div class="intro">

        <div class="small-title">
            ELECTRICAL ENGINEERING • YEAR 01
        </div>


        <h1>
            hi, <span>nooriya</span> here.
        </h1>


        <p class="description">

            Electrical engineering student exploring
            circuits, hardware, technology and the
            creative side of engineering.

        </p>


        <a href="#about" class="button">
            more about me →
        </a>


        <div class="accent-line"></div>

    </div>


</section>



<!-- ==================== INTERACTIVE FIGURE ==================== -->

<script>

    const canvas = document.getElementById("figure");

    const ctx = canvas.getContext("2d");


    canvas.width = 430;

    canvas.height = 520;



    const particles = [];


    const mouse = {

        x: -1000,

        y: -1000

    };



    /*
        TEMPORARY FIGURE

        We will replace this later with
        Nooriya's actual portrait.
    */


    for (let y = 65; y < 465; y += 9) {

        for (let x = 55; x < 375; x += 9) {


            const centerX = 215;



            /* HEAD */

            const head =

                Math.pow((x - centerX) / 76, 2) +

                Math.pow((y - 150) / 108, 2)

                < 1;



            /* NECK */

            const neck =

                y > 225 &&

                y < 300 &&

                Math.abs(x - centerX) < 48;



            /* SHOULDERS / BODY */

            const body =

                y > 270 &&

                Math.pow((x - centerX) / 150, 2) +

                Math.pow((y - 440) / 180, 2)

                < 1;



            if (head || neck || body) {


                /*
                    Character is selected ONCE.

                    This prevents the annoying
                    random popping/flickering.
                */


                const characterSet = [
                    ".",
                    ".",
                    ".",
                    ":",
                    ":",
                    "+"
                ];


                const character =

                    characterSet[

                        Math.floor(

                            Math.random() *

                            characterSet.length

                        )

                    ];



                particles.push({

                    homeX: x,

                    homeY: y,

                    x: x,

                    y: y,

                    vx: 0,

                    vy: 0,

                    character: character

                });

            }

        }

    }



    /* ---------------- MOUSE ---------------- */


    canvas.addEventListener(

        "mousemove",

        function (event) {


            const rect =

                canvas.getBoundingClientRect();



            mouse.x =

                (event.clientX - rect.left)

                *

                (canvas.width / rect.width);



            mouse.y =

                (event.clientY - rect.top)

                *

                (canvas.height / rect.height);

        }

    );



    canvas.addEventListener(

        "mouseleave",

        function () {

            mouse.x = -1000;

            mouse.y = -1000;

        }

    );



    /* ---------------- TOUCH ---------------- */


    canvas.addEventListener(

        "touchmove",

        function (event) {


            event.preventDefault();


            const touch =

                event.touches[0];


            const rect =

                canvas.getBoundingClientRect();



            mouse.x =

                (touch.clientX - rect.left)

                *

                (canvas.width / rect.width);



            mouse.y =

                (touch.clientY - rect.top)

                *

                (canvas.height / rect.height);

        },

        { passive: false }

    );



    canvas.addEventListener(

        "touchend",

        function () {

            mouse.x = -1000;

            mouse.y = -1000;

        }

    );



    /* ---------------- ANIMATION ---------------- */


    function animate() {


        ctx.clearRect(

            0,

            0,

            canvas.width,

            canvas.height

        );



        particles.forEach(function (particle) {


            const dx =

                particle.x - mouse.x;


            const dy =

                particle.y - mouse.y;


            const distance =

                Math.sqrt(

                    dx * dx +

                    dy * dy

                );



            /*
                ONLY MOVE PARTICLES NEAR CURSOR
            */


            if (

                distance < 70 &&

                distance > 0.1

            ) {


                const force =

                    (70 - distance) / 70;



                particle.vx +=

                    (dx / distance)

                    *

                    force

                    *

                    1.8;



                particle.vy +=

                    (dy / distance)

                    *

                    force

                    *

                    1.8;

            }



            /*
                SPRING BACK HOME
            */


            particle.vx +=

                (particle.homeX - particle.x)

                *

                0.035;



            particle.vy +=

                (particle.homeY - particle.y)

                *

                0.035;



            /*
                FRICTION
            */


            particle.vx *= 0.82;

            particle.vy *= 0.82;



            /*
                MOVE PARTICLE
            */


            particle.x += particle.vx;

            particle.y += particle.vy;



            /*
                DRAW

                NEW COLOR:
                #D46489
            */


            ctx.fillStyle = "#D46489";


            ctx.font =

                "9px monospace";


            ctx.fillText(

                particle.character,

                particle.x,

                particle.y

            );

        });



        requestAnimationFrame(

            animate

        );

    }



    animate();


</script>


</body>

</html>

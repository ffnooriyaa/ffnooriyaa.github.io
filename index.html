<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nooriya</title>

<!-- Soft rounded font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
    --background: #091a31;
    --text: #cbd5f5;
    --muted: #8997b7;
    --accent: #55f3d1;
    --border: #263955;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--background);
    color: var(--text);
    font-family: "Nunito", sans-serif;
}


/* NAVIGATION */

nav {
    height: 72px;
    padding: 0 5%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid var(--border);
}

.name {
    font-weight: 700;
    font-size: 19px;
}

.nav-left {
    display: flex;
    align-items: center;
    gap: 38px;
}

.links {
    display: flex;
    gap: 28px;
}

.links a {
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
}

.links a:hover {
    color: var(--accent);
}


/* HERO */

.hero {
    min-height: calc(100vh - 72px);

    display: grid;
    grid-template-columns: 1fr 1.2fr;

    align-items: center;

    max-width: 1200px;
    margin: auto;

    padding: 60px 40px;
}


/* FIGURE */

.figure-container {
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    width: 430px;
    height: 520px;
    max-width: 100%;
    cursor: crosshair;
}


/* INTRO */

.intro {
    padding-left: 40px;
}

h1 {
    font-size: clamp(48px, 5vw, 74px);
    font-weight: 400;
    letter-spacing: -2px;
    margin: 0 0 35px 0;
}

h1 span {
    color: var(--accent);
    font-weight: 700;
}

.description {
    color: var(--muted);
    font-size: 18px;
    line-height: 1.9;
    max-width: 570px;
}

.small-note {
    color: var(--accent);
    margin-top: 35px;
    font-size: 13px;
    opacity: .75;
}


/* MOBILE */

@media (max-width: 800px) {

    .links {
        display: none;
    }

    .hero {
        grid-template-columns: 1fr;
        text-align: center;
        padding: 30px 20px;
    }

    .intro {
        padding-left: 0;
    }

    .figure-container {
        order: 2;
    }

    canvas {
        width: 330px;
        height: 400px;
    }

}

</style>
</head>


<body>


<nav>

    <div class="nav-left">

        <div class="name">
            Nooriya
        </div>

        <div class="links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Experience</a>
            <a href="#">Projects</a>
            <a href="#">Art</a>
        </div>

    </div>

</nav>



<section class="hero">


    <!-- INTERACTIVE FIGURE -->

    <div class="figure-container">

        <canvas id="figure"></canvas>

    </div>



    <!-- INTRO -->

    <div class="intro">

        <h1>
            hi, <span>nooriya</span> here.
        </h1>

        <p class="description">

            Electrical engineering student exploring
            circuits, hardware, technology and the creative
            side of engineering.

        </p>

        <p class="small-note">
            move your cursor over me :)
        </p>

    </div>


</section>



<script>

const canvas = document.getElementById("figure");
const ctx = canvas.getContext("2d");

canvas.width = 430;
canvas.height = 520;

const particles = [];

const mouse = {
    x: -1000,
    y: -1000
};


/*
    TEMPORARY FIGURE

    Later we'll generate these points
    from YOUR portrait.
*/

for (let y = 70; y < 470; y += 9) {

    for (let x = 60; x < 370; x += 9) {

        const centerX = 215;

        const head =
            Math.pow((x - centerX) / 75, 2) +
            Math.pow((y - 150) / 105, 2) < 1;

        const shoulders =
            y > 250 &&
            Math.abs(x - centerX) <
            145 - ((y - 250) * 0.08);

        if (head || shoulders) {

            particles.push({
                homeX: x,
                homeY: y,
                x: x,
                y: y,
                vx: 0,
                vy: 0
            });

        }

    }

}


/* CURSOR POSITION */

canvas.addEventListener("mousemove", (e) => {

    const rect = canvas.getBoundingClientRect();

    mouse.x =
        (e.clientX - rect.left) *
        (canvas.width / rect.width);

    mouse.y =
        (e.clientY - rect.top) *
        (canvas.height / rect.height);

});


canvas.addEventListener("mouseleave", () => {

    mouse.x = -1000;
    mouse.y = -1000;

});



/* ANIMATION */

function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    particles.forEach((p, i) => {


        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;

        const distance =
            Math.sqrt(dx * dx + dy * dy);


        /*
            IMPORTANT:

            Particles ONLY move when your
            cursor gets close to them.
        */

        if (distance < 65 && distance > 0) {

            const force =
                (65 - distance) / 65;

            p.vx +=
                (dx / distance) * force * 1.7;

            p.vy +=
                (dy / distance) * force * 1.7;

        }


        /*
            Gently return to original position
        */

        p.vx +=
            (p.homeX - p.x) * 0.035;

        p.vy +=
            (p.homeY - p.y) * 0.035;


        p.vx *= 0.82;
        p.vy *= 0.82;


        p.x += p.vx;
        p.y += p.vy;


        /*
            IMPORTANT:
            Character is FIXED.

            No Math.random(), therefore the
            portrait does NOT flicker/pop.
        */

        const characters =
            [".", ".", ".", ":", "+"];

        const character =
            characters[i % characters.length];


        ctx.fillStyle = "#55f3d1";

        ctx.font = "9px monospace";

        ctx.fillText(
            character,
            p.x,
            p.y
        );

    });


    requestAnimationFrame(animate);

}


animate();

</script>


</body>
</html>
